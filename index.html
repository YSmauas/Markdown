<script>
/*
  Local-only Markdown renderer. No CDN, imports, fonts, or network calls.
  Supports headings, paragraphs, emphasis, links, images, tables, lists,
  blockquotes, fenced code, inline code, rules, task lists, and selected HTML.

const $ = id => document.getElementById(id);
const source = $('source'), preview = $('preview');
let filename = 'document.md';
const escapeHTML = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function safeUrl(raw, image=false){
  const s=raw.trim();
  if (/^(https?:|mailto:|tel:|#|\/|\.\/|\.\.\/)/i.test(s)) return s;
  if (/^data:image\/(?:png|gif|jpe?g|webp|svg\+xml);base64,/i.test(s) && image) return s;
  // Permit local relative image paths, but reject executable schemes.
  if (image && !/^[a-z][a-z0-9+.-]*:/i.test(s)) return s;
  return '#';
}
function inline(s){
  let out='', stash=[];
  const hold = html => {const n=stash.length;stash.push(html);return `\u0000${n}\u0000`};
  s=escapeHTML(s);
  // Inline code first, protecting its contents.
  s=s.replace(/`([^`\n]+)`/g,(_,c)=>hold('<code>'+c+'</code>'));
  if(skin==='mm'){
   s=s.replace(/%\((#[0-9a-fA-F]{3,8})\)\[([^\]]+)\]/g,'<span style="color:$1">$2</span>');
   s=s.replace(/\*\*\*(.+?)\*\*\*/g,'<u>$1</u>');
   s=s.replace(/(^|\s)II(?=\S)(.+?)(?<=\S)II(?=$|\s|[.,!?:;])/g,'$1<span class="guest-hide" title="מוסתר מאורחים">$2</span>');
   s=s.replace(/°fa-[\w-]+°\(([^)]*)\)/g,'<span class="mm-tip" title="$1" tabindex="0">ⓘ</span>');
   s=s.replace(/&amp;(nbsp|hairsp|#160|#8202);/g,'&$1;');
   s=s.replace(/(^|[\s(])@([\w\u0590-\u05ff-]+)/g,'$1<span class="mention">@$2</span>');
  }
  // Markdown images and links.
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,(_,alt,url,title)=>{
    const u=safeUrl(url,true); return hold(`<img src="${escapeHTML(u)}" alt="${alt}"${title?` title="${title}"`:''} loading="lazy">`);
  });
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,(_,label,url,title)=>{
    const u=safeUrl(url); return hold(`<a href="${escapeHTML(u)}" ${/^https?:/i.test(u)?'target="_blank" rel="noopener noreferrer"':''}${title?` title="${title}"`:''}>${label}</a>`);
  });
  s=s.replace(/&lt;(https?:\/\/[^&\s]+)&gt;/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  s=s.replace(/\*\*(.+?)\*\*|__(.+?)__/g,'<strong>$1$2</strong>');
  s=s.replace(/~~(.+?)~~/g,'<del>$1</del>');

  s=s.replace(/(^|[^_])_([^_\n]+)_(?!_)/g,'$1<em>$2</em>');

}
function isTableLine(s){return /^\s*\|?.+\|.+\|?\s*$/.test(s)}
function splitTableRow(line){return line.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'))}
function render(md){
 const lines=md.replace(/\r\n?/g,'\n').split('\n');let html='',i=0;
 const blank=l=>!l.trim();
 const fence=l=>l.match(/^\s*(```+|~~~+)\s*([^\s]*)?.*$/);
 const isSpecial=(l,nxt='')=>blank(l)||fence(l)||/^\s{0,3}#{1,6}\s/.test(l)||/^\s{0,3}(?:[-*_]\s*){3,}$/.test(l)||/^\s*>/.test(l)||/^\s*([-+*]|\d+[.)])\s+/.test(l)||(isTableLine(l)&&/^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(nxt));
 while(i<lines.length){
  let l=lines[i];
  if(blank(l)){i++;continue}
  let fm=fence(l);
  if(fm){const marker=fm[1][0];i++;let code=[];while(i<lines.length&&!lines[i].trim().startsWith(marker.repeat(3))){code.push(lines[i++])}if(i<lines.length)i++;html+=`<pre><code>${hl(code.join('\n'),fm[2])}</code></pre>`;continue}
  if(skin==='mm'){
   const ma=l.match(/^!!!\s*(info|important|warning|success|danger)\s*(?:\[([^\]]*)\])?\s*:?\s*(.*)$/i);
   if(ma){const t=ma[1].toLowerCase(),b=[ma[3]];i++;while(i<lines.length&&!blank(lines[i])&&!/^!!!/.test(lines[i]))b.push(lines[i++]);html+=`<div class="mm-alert mm-${t}">${ma[2]?`<strong>${escapeHTML(ma[2])}</strong>`:''}<div>${inline(b.join('\n').trim())}</div></div>`;continue}
   if(/^\s*:::\s*$/.test(l)){i++;const inner=[];while(i<lines.length&&!/^\s*:::\s*$/.test(lines[i]))inner.push(lines[i++]);if(i<lines.length)i++;html+=`<details class="mm-spoiler"><summary>ספוילר</summary>${render(inner.join('\n'))}</details>`;continue}
   const al=l.match(/^\s*(->|<-)\s*(.+?)\s*(->|<-)\s*$/);
   if(al){const d=al[1]==='->'?(al[3]==='<-'?'center':'right'):'left';html+=`<p style="text-align:${d}">${inline(al[2])}</p>`;i++;continue}
  }
  let hm=l.match(/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
  if(hm){let level=hm[1].length;html+=`<h${level}>${inline(hm[2])}</h${level}>`;i++;continue}
  if(/^\s{0,3}(?:[-*_]\s*){3,}$/.test(l)){html+='<hr>';i++;continue}
  if(/^\s*>/.test(l)){let q=[];while(i<lines.length&&/^\s*>/.test(lines[i]))q.push(lines[i++].replace(/^\s*>\s?/,''));const am=q[0].match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*$/i);if(am){const t=am[1].toLowerCase(),he={note:'הערה',tip:'טיפ',important:'חשוב',warning:'אזהרה',caution:'זהירות'}[t];html+=`<div class="alert alert-${t}"><p class="alert-title">${he}</p>${render(q.slice(1).join('\n'))}</div>`}else html+=`<blockquote>${render(q.join('\n'))}</blockquote>`;continue}
  // GFM-like pipe tables
  if(i+1<lines.length&&isTableLine(l)&&/^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i+1])){
    const heads=splitTableRow(l), aligns=splitTableRow(lines[i+1]).map(c=>c.startsWith(':')&&c.endsWith(':')?'center':c.endsWith(':')?'right':c.startsWith(':')?'left':'');
    html+='<table><thead><tr>'+heads.map((c,j)=>`<th${aligns[j]?` style="text-align:${aligns[j]}"`:''}>${inline(c)}</th>`).join('')+'</tr></thead><tbody>';i+=2;
    while(i<lines.length&&lines[i].includes('|')&&!blank(lines[i])){const cells=splitTableRow(lines[i]);html+='<tr>'+heads.map((_,j)=>`<td${aligns[j]?` style="text-align:${aligns[j]}"`:''}>${inline(cells[j]||'')}</td>`).join('')+'</tr>';i++}
    html+='</tbody></table>';continue;
  }
  // Lists and task checkboxes
  const lm=l.match(/^(\s*)([-+*]|\d+[.)])\s+(.*)$/);
  if(lm){const ordered=/\d/.test(lm[2]);let items=[],indent=lm[1].length;
    while(i<lines.length){let m=lines[i].match(/^(\s*)([-+*]|\d+[.)])\s+(.*)$/);if(!m||m[1].length!==indent||(/\d/.test(m[2]))!==ordered)break;
      let text=m[3],task=text.match(/^\[([ xX])\]\s+(.*)$/);items.push(task?`<li class="task"><input type="checkbox" disabled ${task[1].toLowerCase()==='x'?'checked':''}>${inline(task[2])}</li>`:`<li>${inline(text)}</li>`);i++}
    html+=`<${ordered?'ol':'ul'}>${items.join('')}</${ordered?'ol':'ul'}>`;continue;
  }
  // Allow a limited set of useful HTML tags; scripts, embeds, event handlers, and styles are removed.
  if(/^\s*<(details|summary|kbd|mark|sup|sub|br|div|span|p|figure|figcaption|img|table|thead|tbody|tr|th|td|strong|em|u|s|del|ins|small|abbr|blockquote|hr|ul|ol|li|h[1-6])\b/i.test(l)){
    let chunk=[];while(i<lines.length&&!blank(lines[i]))chunk.push(lines[i++]);
    html+=sanitizeHTML(chunk.join('\n'));continue;
  }
  // Paragraph: collect until a block begins.
  let p=[l];i++;
  while(i<lines.length&&!isSpecial(lines[i],lines[i+1]||'')){p.push(lines[i++])}
  html+='<p>'+inline(p.join('\n'))+'</p>';
 }

}
function sanitizeHTML(input){
 const doc=new DOMParser().parseFromString(`<body>${input}</body>`,'text/html');

 const walk=node=>{for(const child of [...node.childNodes]){
  if(child.nodeType===1){if(!allowed.has(child.tagName)){child.replaceWith(document.createTextNode(child.textContent));continue}
   for(const a of [...child.attributes]){const n=a.name.toLowerCase(),v=a.value;
    if(n.startsWith('on')||n==='style'||n==='srcdoc'||n==='class'||n==='id'||n==='formaction'){child.removeAttribute(a.name);continue}
    if(child.tagName==='A'&&n==='href'){const safe=safeUrl(v);if(safe==='#'&&v!=='#')child.removeAttribute('href');else child.setAttribute('href',safe);child.setAttribute('rel','noopener noreferrer')}
    else if(child.tagName==='IMG'&&n==='src'){const safe=safeUrl(v,true);if(safe==='#'&&v!=='#')child.removeAttribute('src');else child.setAttribute('src',safe)}
    else if(child.tagName==='IMG'&&n!=='alt'&&n!=='title'&&n!=='width'&&n!=='height'&&n!=='src')child.removeAttribute(a.name);
    else if(child.tagName!=='IMG'&&child.tagName!=='A'&&n!=='title'&&n!=='colspan'&&n!=='rowspan'&&n!=='align')child.removeAttribute(a.name);
   }walk(child)
  }
 }};walk(doc.body);return doc.body.innerHTML;
}
function baseUpdate(){
 const raw=source.value; preview.innerHTML=render(raw); addCodeCopyButtons();
 const words=raw.trim()?raw.trim().split(/\s+/).length:0;$('wordCount').textContent=words.toLocaleString('he-IL')+' מילים';
 const dir=$('direction').value;preview.dir=dir==='auto'?( /[\u0590-\u05FF]/.test(raw)?'rtl':'ltr'):dir;

$('mmAlert').onchange=e=>{if(e.target.value)editSelection('\n\n!!! '+e.target.value+' [MitmachimTop]: ','\n\n','טקסט ההתראה');e.target.value=''};
source.addEventListener('keydown',e=>{if(skin==='mm'&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='u'){e.preventDefault();MM.u()}});
try{setSkin(localStorage.getItem('mdreader.skin')==='mm'?'mm':'gh',true)}catch(e){}

// ===== GitHub-style outline dropdown =====
$('ghOutline').onclick=e=>{e.stopPropagation();const p=$('ghOutlinePop'),open=p.hidden;p.hidden=!open;$('ghOutline').setAttribute('aria-expanded',String(open))};
document.addEventListener('click',e=>{if(!e.target.closest('#ghOutlinePop,#ghOutline'))closeOutline()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeOutline()});
$('ghEdit').onclick=()=>{if(matchMedia('(max-width:800px)').matches)mobileTab('editor');source.focus()};

restoreDraft();
</script>
</body>
</html>
